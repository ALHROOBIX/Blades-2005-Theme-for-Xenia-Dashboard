<section class="page" id="achievements-page" x-data x-init="$store.actions.setFocusContext('achievements'); $store.actions.loadAchievementsData()">
    
    <div class="blade-dynamic-bg" style="background-image: url('assets/images/wallpapers/Games.png'); position: absolute; top:0; left:0; width:100%; height:100%; z-index:-1;"></div>
    <div class="global-glass-bg" style="z-index:-1;"></div>

    <style>
        
        
        #achievements-page {
            background: transparent !important; 
            display: flex;
            align-items: center !important; 
            justify-content: center !important; 
            position: relative;
        }

        
        .ach-split-layout {
            position: relative;
            z-index: 10;
            width: 90vw;
            max-width: 1200px;
            height: 72vh; 
            margin: 0 !important; 
            display: flex;
            background: #ffffff; 
            font-family: 'XBOX', "Segoe UI", "Source Sans 3", sans-serif;
            border-radius: 8px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            border: 1px solid #ccc;
            overflow: hidden;
        }

        
        .ach-left-pane {
            width: 35%;
            min-width: 320px;
            background: #eeeeee;
            height: 100%;
            overflow-y: auto;
            border-right: 2px solid #cccccc;
            z-index: 10;
            transition: filter 0.3s ease;
        }

        .ach-left-pane.inactive {
            filter: brightness(0.5);
            pointer-events: none;
        }

        
        .ach-list-item {
            display: flex;
            align-items: center;
            padding: 16px 25px;
            gap: 15px;
            cursor: pointer;
            border-left: 5px solid transparent;
            transition: background 0.1s;
        }

        
        .ach-list-item.focused {
            background: #ffffff; 
            border-left: 5px solid #000000;
        }

        
        .ach-list-img {
            width: 45px;
            height: 45px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
            filter: opacity(0.8) drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000);
        }
        .ach-list-item.focused .ach-list-img {
            filter: drop-shadow(1.5px 0 0 #000) drop-shadow(-1.5px 0 0 #000) drop-shadow(0 1.5px 0 #000) drop-shadow(0 -1.5px 0 #000);
        }

        
        .ach-list-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .ach-list-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ach-list-item.focused .ach-list-title { color: #000000; font-weight: 900; }

        .ach-list-id {
            font-size: 0.75rem;
            color: #777777;
            font-weight: bold;
            margin-top: 3px;
        }
        .ach-list-item.focused .ach-list-id { color: #333333; }

        
        .ach-right-pane {
            flex: 1;
            height: 100%;
            position: relative;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .ach-right-content {
            display: flex;
            flex-direction: column; 
            height: 100%;
            animation: fadeIn 0.3s ease;
        }

        
        .ach-right-header {
            flex-shrink: 0; 
            padding: 30px 40px 15px 40px;
            display: flex;
            flex-direction: column;
            border-bottom: 2px solid #eeeeee;
        }

        .ach-right-header h1 {
            color: #000000;
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ach-score {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333333;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        
        .ach-right-grid {
            flex: 1; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); 
            gap: 12px;
            align-content: start;
            overflow-y: auto; 
            padding: 20px 40px;
        }

        
        .ach-grid-slot {
            aspect-ratio: 1/1;
            background: #f4f4f4;
            border-radius: 4px;
            border: 2px solid #cccccc; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .ach-grid-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
        }

        .ach-grid-slot .locked-overlay {
            position: absolute;
            font-size: 18px;
            color: #000;
            opacity: 0.7;
        }
        .locked-overlay .lock-icon {
            width: 24px;
            height: 24px;
            display: block;
            filter: opacity(0.8) 
            drop-shadow(1px 0 0 #000) 
            drop-shadow(-1px 0 0 #000) 
            drop-shadow(0 1px 0 #000) 
            drop-shadow(0 -1px 0 #000) !important;
        }

        
        .ach-grid-slot.focused {
            border-color: #000000; 
            transform: scale(1.15); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 5;
            background: #ffffff;
        }

        
        .ach-interactive-details {
            flex-shrink: 0; 
            background: #f9f9f9; 
            border-top: 2px solid #eeeeee;
            padding: 20px 40px;
            min-height: 140px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .ach-detail-title {
            color: #000000;
            font-size: 1.4rem;
            margin: 0;
            font-weight: 800;
        }

        .ach-detail-score {
            color: #333333;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .ach-detail-desc {
            color: #444444;
            font-size: 1rem;
            margin: 8px 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .ach-detail-status {
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .ach-detail-status.unlocked { color: #000000; }
        .ach-detail-status.locked { color: #888888; }

        
        .hide-scroll::-webkit-scrollbar { width: 6px; }
        .hide-scroll::-webkit-scrollbar-thumb { background: #000000; border-radius: 0; }
        .hide-scroll::-webkit-scrollbar-track { background: #eeeeee; }
        
        
        #achievements-page .nxe-footer-left {
            position: fixed;
            bottom: 25px !important;
            left: 50% !important;
            right: auto !important; 
            transform: translateX(-50%) !important;
            width: auto; 
            height: 60px !important;
            padding: 0 45px !important;
            border-radius: 50px !important;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5000;
        }

        #achievements-page .footer-button,
        #achievements-page .footer-button span {
            color: #000000 !important;
            text-shadow: none !important;
            font-weight: 800 !important;
        }

        #achievements-page .button-icon {
            border: 2px solid #000000 !important;
            box-shadow: 2px 2px 0px #000000 !important;
            border-radius: 50% !important;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        
        html[dir="rtl"] .ach-split-layout { flex-direction: row-reverse; }
        html[dir="rtl"] .ach-left-pane { border-right: none; border-left: 2px solid #cccccc; }
        
        html[dir="rtl"] .ach-list-item {
            flex-direction: row-reverse;
            border-left: none;
            border-right: 5px solid transparent;
            text-align: right;
        }
        html[dir="rtl"] .ach-list-item.focused {
            border-right: 5px solid #000000;
        }
        html[dir="rtl"] .ach-right-header, 
        html[dir="rtl"] .ach-interactive-details {
            text-align: right;
        }
    </style>

    <div class="ach-split-layout">
        
        <div class="ach-left-pane hide-scroll" :class="{'inactive': $store.app.isAchievementOverlayOpen}">
            <template x-for="(game, index) in $store.app.achievementsGamesList" :key="game.titleID">
                <div class="ach-list-item"
                     :id="'ach-card-' + index"
                     :class="{'focused': $store.app.focusedIndex === index && !$store.app.isAchievementOverlayOpen}">
                    
                    <img :src="($store.app.filteredLibraryGames.find(g => g.titleID === game.titleID)?.iconUrl) || game.coverUrl || 'assets/icons/placeholder.png'" class="ach-list-img">
                    
                    <div class="ach-list-info">
                        <div class="ach-list-title" x-text="game.name"></div>
                        <div class="ach-list-id" x-text="'TITLE ID: ' + game.titleID"></div>
                    </div>
                </div>
            </template>
        </div>

        <div class="ach-right-pane">

            <template x-if="!$store.app.isAchievementOverlayOpen && $store.app.achievementsGamesList[$store.app.focusedIndex]">
                <div class="ach-right-content">
                    <div class="ach-right-header">
                        <h1 x-text="$store.app.t('dashboard_menu.achievements') || 'Achievements'"></h1>
                        <div class="ach-score">
                            G <span x-text="$store.app.achievementsGamesList[$store.app.focusedIndex].earnedScore || 0"></span>
                        </div>
                    </div>
                    <div class="ach-right-grid hide-scroll">
                        <template x-for="ach in ($store.app.achievementsGamesList[$store.app.focusedIndex].realAchievements || [])" :key="ach.id">
                            <div class="ach-grid-slot">
                                <img :src="ach.full_image" x-show="ach.full_image" :style="!ach.unlocked ? 'filter: grayscale(1) opacity(0.3);' : ''">
                                <div class="locked-overlay" x-show="!ach.unlocked">
                                    <img src="assets/icons/metro_lock.png" alt="Locked" class="lock-icon">
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template x-if="$store.app.isAchievementOverlayOpen && $store.app.selectedAchievementGame">
                <div class="ach-right-content">
                    <div class="ach-right-header">
                        <h1 x-text="$store.app.t('dashboard_menu.achievements') || 'Achievements'"></h1>
                        <div class="ach-score">
                            G <span x-text="$store.app.selectedAchievementGame.earnedScore || 0"></span>
                        </div>
                    </div>

                    <div class="ach-right-grid hide-scroll">
                        <template x-for="(ach, idx) in ($store.app.selectedAchievementGame.realAchievements || [])" :key="ach.id">
                            <div :id="'ach-slot-' + idx"
                                 class="ach-grid-slot"
                                 :class="{'focused': $store.app.focusedAchievementIndex === idx}">
                                <img :src="ach.full_image" x-show="ach.full_image" :style="!ach.unlocked ? 'filter: grayscale(1) opacity(0.3);' : ''">
                                <div class="locked-overlay" x-show="!ach.unlocked">
                                    <img src="assets/icons/metro_lock.png" alt="Locked" class="lock-icon">
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="ach-interactive-details">
                        <template x-if="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex]">
                            <div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <h2 class="ach-detail-title" x-text="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex].name"></h2>
                                    <div class="ach-detail-score">G <span x-text="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex].score"></span></div>
                                </div>
                                <p class="ach-detail-desc" x-text="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex].description"></p>
                                <div class="ach-detail-status" 
                                     :class="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex].unlocked ? 'unlocked' : 'locked'" 
                                     x-text="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex].unlocked ? 'Unlocked' : 'Locked'">
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template x-if="!$store.app.achievementsGamesList || $store.app.achievementsGamesList.length === 0">
                <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #fff; font-size: 20px;">
                    <p x-text="$store.app.t('achievements.NoAchievements') || 'No Achievement History Found'"></p>
                </div>
            </template>

        </div>
    </div>
    
    <footer class="nxe-footer-left">
        <div class="footer-button" @click="$store.actions.goBack()">
            <span class="button-icon b">B</span> 
            <span x-text="$store.app.t('generic.back') || 'Back'"></span>
        </div>

        <div class="footer-button" @click="$store.actions.openAchievementOverlay()">
            <span class="button-icon a">A</span> 
            <span x-text="$store.app.t('generic.details') || 'Details'"></span>
        </div>

        <div class="footer-button" @click="$store.actions.refreshCurrentGame()">
            <span class="button-icon y">Y</span> 
            <span x-text="$store.app.t('generic.refresh') || 'Refresh'"></span>
        </div>
    </footer>
</section>
