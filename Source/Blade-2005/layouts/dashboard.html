<section 
    class="page classic-blades-dashboard" 
    id="dashboard" 
    x-data 
    x-init="$store.actions.loadDashboardData()"
>
    <div class="blade-dynamic-bg" 
        :style="'background-image: ' + 
            ($store.app.masterIndex === 0 ? ($store.app.displaySettings.homeBg ? `url('file:///${$store.app.displaySettings.homeBg.replace(/\\/g, '/')}')` : `url('assets/images/wallpapers/Home.png')`) : 
            $store.app.masterIndex === 1 ? ($store.app.displaySettings.gamesBg ? `url('file:///${$store.app.displaySettings.gamesBg.replace(/\\/g, '/')}')` : `url('assets/images/wallpapers/Games.png')`) : 
            $store.app.masterIndex === 2 ? ($store.app.displaySettings.settingsBg ? `url('file:///${$store.app.displaySettings.settingsBg.replace(/\\/g, '/')}')` : `url('assets/images/wallpapers/Settings.png')`) : 
            ($store.app.displaySettings.aboutBg ? `url('file:///${$store.app.displaySettings.aboutBg.replace(/\\/g, '/')}')` : `url('assets/images/wallpapers/About.png')`))">
    </div>

    <div class="global-glass-bg"></div>

    <div class="blade-runner left-runner"></div>
    <div class="blade-runner right-runner"></div>

    <div class="blades-master-container" :style="'--total-tabs: ' + $store.app.masterMenu.length + ';'">
        <template x-for="(tab, tIndex) in $store.app.masterMenu" :key="tab.id">
            
            <div class="blade-tab"
                 :style="`--idx: ${tIndex}; z-index: ${$store.app.masterIndex === tIndex ? 50 : (tIndex < $store.app.masterIndex ? tIndex : 20 - tIndex)};`"
                 :class="{
                    'active': $store.app.masterIndex === tIndex,
                    'stacked-left': tIndex < $store.app.masterIndex,
                    'stacked-right': tIndex > $store.app.masterIndex
                 }">
                
                <div class="blade-spine spine-left" 
                    x-show="tIndex <= $store.app.masterIndex" 
                    :style="'background-image: url(assets/images/blades/blades-size' + (Math.abs($store.app.masterIndex - tIndex) === 0 ? 3 : (4 - Math.min(Math.abs($store.app.masterIndex - tIndex), 3))) + '-left-NF.png)'"
                    @click="if(tIndex < $store.app.masterIndex) { $store.app.masterIndex = tIndex; $store.actions.updateDetailMenu(); $store.actions.playSound('channelUp'); }">
                    <span x-text="$store.app.t('dashboard_menu.' + tab.id) || tab.name"></span>
                </div>

                <div class="blade-header-absolute" x-show="$store.app.masterIndex === tIndex">
                    <h1 x-text="$store.app.t('dashboard_menu.' + tab.id) || tab.name"></h1>
                </div>

                <div class="blade-glass-area" x-show="$store.app.masterIndex === tIndex" x-transition.opacity.duration.200ms>
                    <div class="blade-content-item">
                        
                        <template x-if="tab.id === 'home'">
                            <div class="layout-home">
                                <div class="home-top-section">
                                    <div class="home-col-left">
                                        <div class="classic-player-card" @click="$store.app.isProfileSelectorOpen = true; $store.actions.playSound('panelUnfold')">
                                            <div class="card-header" x-text="$store.app.playerTag || 'player-name'"></div>
                                            <div class="card-body">
                                                <div class="card-avatar">
                                                    <template x-if="$store.app.userAvatar"><img :src="$store.app.userAvatar"></template>
                                                    <template x-if="!$store.app.userAvatar"><div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:20px;color:#fff;">☺</div></template>
                                                </div>
                                                <div class="card-stats">
                                                    <div class="score"><span class="g-icon">G</span> <span x-text="$store.app.gamerscore || 0"></span></div>
                                                    <div class="status" x-text="($store.app.settings.xeniaPath || '').toLowerCase().includes('netplay') ? ($store.app.t('dashboard_menu.online') || 'Online') : ($store.app.t('dashboard_menu.offline') || 'Offline')"></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="home-bottom-tray" :class="{'focused': $store.app.detailIndex === 0 && $store.app.focusedList === 'detail'}" @click="$store.app.detailIndex = 0; $store.actions.selectDetailItem()">
                                            <template x-if="$store.app.detailMenu[0]?.isGameIcon">
                                                <div class="tray-disc-container">
                                                    <div class="loaded-disc-wrapper">
                                                        <div class="disc-game-art" :style="`background-image: url(${$store.app.detailMenu[0]?.icon})`"></div>
                                                        <img src="assets/images/items/cover-play-disk.webp" class="overlay-disc-img">
                                                    </div>
                                                </div>
                                            </template>

                                            <span class="tray-arrow" :style="!$store.app.detailMenu[0]?.isGameIcon ? 'margin-inline-start: 15px;' : ''">◀</span>
                                            <span class="tray-text" x-text="$store.app.t('dashboard_menu.opentray') || $store.app.detailMenu[0]?.name || 'Open Tray'"></span>
                                        </div>
                                    </div>
                                    <div class="home-col-right">
                                        <div class="content-box large-box" 
                                            :class="{'focused': $store.app.detailIndex === 1 && $store.app.focusedList === 'detail'}" 
                                            @click="$store.app.detailIndex = 1; $store.actions.selectDetailItem()"
                                            :style="$store.app.detailMenu[1]?.heroUrl ? `background-image: url('${$store.app.detailMenu[1].heroUrl}'); background-size: ${$store.app.detailMenu[1].heroUrl.includes('logo_home.webp') ? 'contain' : 'cover'}; background-position: center; background-repeat: no-repeat; border: none; background-color: transparent;` : ''">
                                            
                                            <span x-show="!$store.app.detailMenu[1]?.heroUrl || $store.app.detailMenu[1]?.heroUrl.includes('logo_home.webp')" x-text="$store.app.detailMenu[1]?.name || ''"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <template x-if="tab.id === 'games'">
                            <div class="layout-games">
                                <div class="home-col-left">
                                    <div class="classic-player-card">
                                        <div class="card-header" x-text="$store.app.playerTag || 'player-name'"></div>
                                        <div class="card-body">
                                            <div class="card-avatar">
                                                <template x-if="$store.app.userAvatar"><img :src="$store.app.userAvatar"></template>
                                                <template x-if="!$store.app.userAvatar"><div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:20px;color:#fff;">☺</div></template>
                                            </div>
                                            <div class="card-stats">
                                                <div class="score"><span class="g-icon">G</span> <span x-text="$store.app.gamerscore || 0"></span></div>
                                                <div class="status" x-text="($store.app.settings.xeniaPath || '').toLowerCase().includes('netplay') ? ($store.app.t('dashboard_menu.online') || 'Online') : ($store.app.t('dashboard_menu.offline') || 'Offline')"></div>
                                            </div>
                                        </div>
                                    </div>
                                   <ul class="classic-list">
                                        <template x-for="(item, dIndex) in tab.detailMenu" :key="item.id">
                                            <li :class="{'focused': $store.app.detailIndex === dIndex && $store.app.focusedList === 'detail'}"
                                                @click="$store.app.detailIndex = dIndex; $store.actions.selectDetailItem()"
                                                style="position: relative; overflow: hidden;">
                                                
                                                <img x-show="item.logoUrl" 
                                                :src="item.logoUrl" 
                                                :class="{'fade-transition': true, 'faded-out': $store.app.isHeroFading && item.id === 'gamelibrary'}"
                                                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; pointer-events: none;">
                                                
                                                <template x-if="item.icon">
                                                    <img :src="item.icon" class="list-icon" style="z-index: 2; position: relative;">
                                                </template>
                                                
                                                <span x-text="$store.app.t('dashboard_menu.' + item.id) || item.name" style="z-index: 2; position: relative; text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,0.5);"></span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                                <div class="games-col-right">
                                    <template x-if="$store.app.detailMenu[$store.app.detailIndex]?.id === 'gamelibrary'">
                                        <div class="image-box large-img"
                                            :class="{'fade-transition': true, 'faded-out': $store.app.isHeroFading}"
                                            :style="$store.app.detailMenu[$store.app.detailIndex]?.heroUrl ? `background-image: url('${$store.app.detailMenu[$store.app.detailIndex].heroUrl}'); background-size: cover; background-position: center; background-repeat: no-repeat; border: none; background-color: transparent;` : ''">
                                            
                                            <span x-show="!$store.app.detailMenu[$store.app.detailIndex]?.heroUrl" 
                                                x-text="$store.app.detailMenu[$store.app.detailIndex]?.name"></span>
                                        </div>
                                    </template>

                                    <template x-if="$store.app.detailMenu[$store.app.detailIndex]?.id === 'achievements'">
                                        <div class="random-achievement-container"
                                            :class="{'fade-transition': true, 'faded-out': $store.app.isAchievementFading}">
                                            
                                            <template x-if="$store.app.currentRandomAchievement">
                                                <div class="ra-content">
                                                    <div class="ra-left">
                                                        <img :src="$store.app.currentRandomAchievement.full_image" class="ra-ach-img" 
                                                            :style="!$store.app.currentRandomAchievement.unlocked ? 'filter: grayscale(1) opacity(0.4);' : ''">
                                                        
                                                        <div class="ra-score">G <span x-text="$store.app.currentRandomAchievement.score"></span></div>
                                                    </div>
                                                    
                                                    <div class="ra-right">
                                                        <div class="ra-game-name" x-text="$store.app.currentRandomAchievement.gameName"></div>
                                                        <h2 class="ra-title" x-text="$store.app.currentRandomAchievement.name"></h2>
                                                        <p class="ra-desc" x-text="$store.app.currentRandomAchievement.description"></p>
                                                        
                                                        <div class="ra-status" 
                                                            :class="$store.app.currentRandomAchievement.unlocked ? 'unlocked' : 'locked'"
                                                            x-text="$store.app.currentRandomAchievement.unlocked ? 'Unlocked' : 'Locked'">
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>

                                            <template x-if="!$store.app.currentRandomAchievement">
                                                <div style="width: 100%; text-align: center; color: #fff; font-size: 20px; font-weight: bold;" x-text="$store.app.t('dashboard_menu.achievements') || 'Achievements'"></div>
                                            </template>
                                        </div>
                                    </template>

                                </div>
                            </div>
                        </template>

                        <template x-if="tab.id === 'settings' || tab.id === 'about'">
                            <div class="layout-settings">
                                <div class="home-col-left">
                                    <ul class="classic-list full-list">
                                        <template x-for="(item, dIndex) in tab.detailMenu" :key="item.id">
                                            <li :class="{'focused': $store.app.detailIndex === dIndex && $store.app.focusedList === 'detail'}"
                                                @click="$store.app.detailIndex = dIndex; $store.actions.selectDetailItem()">
                                                <template x-if="item.icon">
                                                    <img :src="item.icon" class="list-icon">
                                                </template>
                                                <span x-text="tab.id === 'settings' ? ($store.app.t('settings.' + $store.app.settingsMenu[dIndex]?.id + '_title') || item.name) : ($store.app.t('about.' + item.id) || item.name)"></span>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                                <div class="settings-col-right">
                                    <div class="description-box">
                                        <h2 x-text="tab.id === 'settings' ? $store.app.t('settings.' + $store.app.settingsMenu[$store.app.detailIndex]?.id + '_title') : ($store.app.t('dashboard_menu.about') || 'ABOUT SYSTEM')"></h2>
                                        
                                        <template x-if="tab.id === 'settings'">
                                            <p x-text="$store.app.t('settings.' + $store.app.settingsMenu[$store.app.detailIndex]?.id + '_desc')"></p>
                                        </template>

                                        <template x-if="tab.id === 'about'">
                                            <div class="about-theme-desc" style="display: flex; flex-direction: column; height: 100%;">
                                                
                                                <h3 style="color: #ffffff; font-size: 22px; font-weight: 800; margin: 0 0 10px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8);" 
                                                    x-text="$store.app.t('about.theme_title')"></h3>
                                                
                                                <p style="font-size: 16px; line-height: 1.8; color: #dddddd; text-shadow: 0 1px 2px rgba(0,0,0,0.8); margin: 0;"
                                                x-text="$store.app.t('about.theme_desc')"></p>
                                                
                                                <div style="margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.15); display: flex; gap: 30px; font-size: 14px; color: #aaaaaa;">
                                                    <div><strong style="color:#ffffff;" x-text="$store.app.t('about.ui_version')"></strong> 1.0.2 Stable</div>
                                                    <div><strong style="color:#ffffff;" x-text="$store.app.t('about.system')"></strong> Xenia Emulator</div>
                                                </div>

                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                    </div> 
                </div> 
                <div class="blade-spine spine-right" 
                    x-show="tIndex > $store.app.masterIndex" 
                    :style="'background-image: url(assets/images/blades/blades-size' + (4 - Math.min(Math.abs($store.app.masterIndex - tIndex), 3)) + '-right-NF.png)'"
                    @click="if(tIndex > $store.app.masterIndex) { $store.app.masterIndex = tIndex; $store.actions.updateDetailMenu(); $store.actions.playSound('channelDown'); }">
                    <span x-text="$store.app.t('dashboard_menu.' + tab.id) || tab.name"></span>
                </div>

            </div>
        </template>
    </div>

    <footer class="nxe-footer-left">
        <div class="footer-button" id="btn-a">
            <span class="button-icon a">A</span> 
            <span x-text="$store.app.t('generic.select')"></span>
        </div>
        <div class="footer-button" id="btn-y" @click.prevent="$store.actions.changeUserAvatar()">
            <span class="button-icon y">Y</span>
            <span x-text="$store.app.t('dashboard.change_avatar')"></span>
        </div>
        <div class="footer-button" id="btn-menu">
            <span class="button-icon menu">LB+Start</span> 
            <span x-text="$store.app.t('dashboard.menu')"></span>
        </div>
    </footer>
<div class="profile-blade-overlay" 
         x-show="$store.app.isProfileSelectorOpen" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-x-[100px]"
         x-transition:enter-end="opacity-100 translate-x-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-x-0"
         x-transition:leave-end="opacity-0 translate-x-[100px]"
         style="display: none;"
         x-cloak>
         
        <div class="profile-blade-backdrop" @click="!$store.app.isKeyboardOpen && ($store.app.isProfileSelectorOpen = false)"></div>

        <div class="profile-blade-master">
            
            <div class="profile-blade-spine">
                <span x-text="$store.app.t('profile.blade_title') || 'PROFILES'"></span>
            </div>

            <div class="profile-blade-content">
                
                <h2 class="profile-header-title" x-text="$store.app.isKeyboardOpen ? ($store.app.keyboardMode === 'create_profile' ? ($store.app.t('profile.create_title') || 'Create New Profile') : ($store.app.t('profile.rename_title') || 'Rename Profile')) : ($store.app.t('profile.switch_user') || 'Select Profile')"></h2>

                <template x-if="!$store.app.isKeyboardOpen">
                    <div style="display: flex; flex-direction: column; height: 100%;">
                        <ul class="profile-blade-list">
                            <template x-for="(profile, index) in $store.app.profilesList" :key="profile.xuid">
                                <li class="profile-list-item" 
                                    :id="'profile-item-' + index"
                                    :class="{'active': profile.slot === $store.app.activeProfileSlot, 'focused': $store.app.focusedProfileIndex === index}"
                                    @click="$store.actions.switchActiveProfile(profile.slot)">
                                    
                                    <div class="pb-avatar">
                                        <template x-if="profile.avatar">
                                            <img :src="profile.avatar + '?update=' + $store.app.activeProfileSlot">
                                        </template>
                                        <template x-if="!profile.avatar">
                                            <div style="font-size: 24px; color: #fff;">☺</div>
                                        </template>
                                    </div>
                                    
                                    <div class="pb-details">
                                        <div class="pb-name" x-text="profile.gamertag"></div>
                                        <div class="pb-score">
                                            <span class="g-icon" style="width: 14px; height:14px; font-size:10px;">G</span> 
                                            <span x-text="profile.total_gamerscore || 0"></span>
                                        </div>
                                    </div>
                                    
                                    <div class="pb-slot" x-text="profile.slot !== null ? 'Slot ' + profile.slot : 'Unassigned'"></div>
                                    
                                    <template x-if="profile.slot === $store.app.activeProfileSlot">
                                        <div style="margin-left: auto; color: #107c10; font-size: 20px; font-weight: bold;">✔</div>
                                    </template>
                                </li>
                            </template>

                            <li class="profile-list-item" 
                                :class="{'focused': $store.app.focusedProfileIndex === $store.app.profilesList.length}"
                                @click="$store.actions.createNewProfilePrompt()">
                                <div class="pb-avatar" style="background: transparent; color: #107c10; font-size: 30px; font-weight: bold;">+</div>
                                <div class="pb-details">
                                    <div class="pb-name">Create New Profile</div>
                                    <div class="pb-slot" x-text="$store.app.t('profile.local_creation') || 'Scan & Add locally'"></div>
                                </div>
                            </li>
                        </ul>

                        <div class="profile-blade-footer">
                            <template x-if="$store.app.profilesList[$store.app.focusedProfileIndex]?.slot === null">
                                <div class="pb-footer-btn" @click.stop="$store.actions.loginFocusedProfile()">
                                    <span class="button-icon menu">RB</span> <span x-text="$store.app.t('generic.Login')">Login</span>
                                </div>
                            </template>
                            <template x-if="$store.app.profilesList[$store.app.focusedProfileIndex]?.slot !== null">
                                <div class="pb-footer-btn" @click.stop="$store.actions.logoutFocusedProfile()">
                                    <span class="button-icon menu">LB</span> <span x-text="$store.app.t('generic.Logout')">Logout</span>
                                </div>
                            </template>
                            <template x-if="$store.app.focusedProfileIndex < $store.app.profilesList.length">
                                <div class="pb-footer-btn" @click.stop="$store.actions.deleteFocusedProfile()">
                                    <span class="button-icon menu" style="min-width:40px;">Back</span> <span x-text="$store.app.t('generic.Delete')">Delete</span>
                                </div>
                            </template>
                            
                            <div class="pb-footer-btn" @click.stop="$store.actions.startRenameProfilePrompt()">
                                <span class="button-icon menu" style="min-width: 40px;">Start</span> <span x-text="$store.app.t('generic.rename') || 'Rename'"></span>
                            </div>

                            <div class="pb-footer-btn" @click="$store.actions.createNewProfilePrompt()">
                                <span class="button-icon y">Y</span> <span x-text="$store.app.t('generic.Create')">Create</span>
                            </div>
                            <div class="pb-footer-btn" @click.stop="$store.actions.changeFocusedProfileAvatar()">
                                <span class="button-icon x">X</span> <span x-text="$store.app.t('profile.change_photo')">Change Photo</span>
                            </div>
                            <div class="pb-footer-btn" @click="$store.app.isProfileSelectorOpen = false">
                                <span class="button-icon b">B</span> <span x-text="$store.app.t('generic.back')">Close</span>
                            </div>
                        </div>
                    </div>
                </template>

                <template x-if="$store.app.isKeyboardOpen">
                    <div class="xbox-kb-wrapper" style="width: 100%; box-shadow: none; border:none; background: transparent; padding: 0;">
                        <div class="xbox-kb-input-row" style="background: rgba(0,0,0,0.1); border-color: rgba(0,0,0,0.3);">
                            <input type="text" class="xbox-kb-input" style="color:#000; font-weight:bold;" :value="$store.app.newProfileName" readonly>
                            <div class="input-cursor" id="kb-cursor-indicator" style="background-color: #107c10; box-shadow: none;"></div>
                        </div>
                        <div class="xbox-kb-main-body">
                            <div class="kb-col side-col left">
                                <div class="side-btn" style="border-color: rgba(0,0,0,0.2);" @click="$store.actions.moveTextCursor(-1)"><div class="btn-icon-visual lb-shape" style="color:#111;">◀ LB</div><span class="btn-label" style="color:#111;" x-text="$store.app.t('generic.left') || 'Left'"></span></div>
                                <div class="side-btn" style="border-color: rgba(0,0,0,0.2);" :class="{'active-state': $store.app.isSymbols}" @click="$store.actions.handleKeyboardSpecial('SYMBOLS')"><div class="btn-icon-visual lt-shape" style="color:#111;">LT</div><span class="btn-label" style="color:#111;" x-text="$store.app.t('generic.symbols') || 'Symbols'"></span></div>
                                <div class="side-btn" style="border-color: rgba(0,0,0,0.2);" :class="{'active-state': $store.app.isCaps}" @click="$store.actions.handleKeyboardSpecial('CAPS')"><div class="btn-icon-visual stick-shape" style="color:#111;">L3</div><span class="btn-label" style="color:#111;" x-text="$store.app.t('generic.caps') || 'Caps'"></span></div>
                            </div>
                            
                            <div class="kb-col center-col">
                                <div class="keys-grid-tight">
                                    <template x-for="(row, rIndex) in $store.app.currentKeys" :key="rIndex">
                                        <div class="keys-row-tight">
                                            <template x-for="(key, cIndex) in row" :key="cIndex">
                                                <div class="xbox-key-tight" 
                                                     style="background: rgba(0,0,0,0.05); color: #000; border-color: rgba(0,0,0,0.2);"
                                                     :class="{'focused': $store.app.keyboardRow === rIndex && $store.app.keyboardCol === cIndex}" 
                                                     @click="$store.app.keyboardRow = rIndex; $store.app.keyboardCol = cIndex; $store.actions.pressKeyboardKey()">
                                                    <span x-text="key"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <div class="bottom-actions-row">
                                    <div class="wide-action-btn" style="color:#333; font-weight:bold;" @click="$store.actions.handleKeyboardSpecial('BACKSPACE')"><div class="circle-icon blue">X</div><span x-text="$store.app.t('generic.backspace') || 'Backspace'"></span></div>
                                    <div class="wide-action-btn" style="color:#333; font-weight:bold;" @click="$store.actions.handleKeyboardSpecial('SPACE')"><div class="circle-icon yellow">Y</div><span x-text="$store.app.t('generic.space') || 'Space'"></span></div>
                                </div>
                            </div>
                            
                            <div class="kb-col side-col right">
                                <div class="side-btn" style="border-color: rgba(0,0,0,0.2);" @click="$store.actions.moveTextCursor(1)"><div class="btn-icon-visual rb-shape" style="color:#111;">RB ▶</div><span class="btn-label" style="color:#111;" x-text="$store.app.t('generic.right') || 'Right'"></span></div>
                                <div class="side-btn" style="border-color: rgba(0,0,0,0.2);" :class="{'active-state': $store.app.isAccents}" @click="$store.actions.handleKeyboardSpecial('ACCENTS')"><div class="btn-icon-visual rt-shape" style="color:#111;">RT</div><span class="btn-label" style="color:#111;" x-text="$store.app.t('generic.accents') || 'Accents'"></span></div>
                                <div class="done-btn-container" style="background:#107c10; color:#fff;" @click="$store.actions.handleKeyboardSpecial('DONE')"><div class="play-icon-circle">▶</div><span x-text="$store.app.t('generic.done') || 'Done'"></span></div>
                            </div>
                        </div>
                        <div class="kb-black-footer" style="border-color:rgba(0,0,0,0.1);">
